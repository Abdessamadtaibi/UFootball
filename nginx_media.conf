# Add this to your Nginx server block for ufootball.siliad.ma
# This allows Nginx to serve media files directly (more efficient than Django)

# Serve media files
location /media/ {
    alias /path/to/your/backend/media/;  # Replace with actual path, e.g., /var/www/backend/media/
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# Serve static files
location /static/ {
    alias /path/to/your/backend/staticfiles/;  # Replace with actual path
    expires 30d;
    add_header Cache-Control "public, immutable";
}

