{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Activated – UFootball</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1d2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #2a2d3e;
      padding: 2.5rem 2rem;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .logo-container {
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      overflow: hidden;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .logo-text {
      font-size: 1.8rem;
      font-weight: bold;
      color: white;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #9ca3af;
    }

    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 2rem 0;
    }

    .success-icon {
      width: 50px;
      height: 50px;
      background: rgba(16, 185, 129, 0.2);
      border: 2px solid #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .success-icon svg {
      width: 24px;
      height: 24px;
      fill: #10b981;
    }

    .success-badge {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #10b981;
      padding: 0.5rem 1rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    h1 {
      font-size: 1.5rem;
      color: white;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    p {
      font-size: 0.95rem;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      width: 100%;
      background: #00bfff;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background: #0099cc;
    }

    @media (max-width: 500px) {
      .card {
        padding: 2rem 1.5rem;
      }

      .logo-text {
        font-size: 1.6rem;
      }

      h1 {
        font-size: 1.3rem;
      }

      .logo-icon {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo-container">
      <div class="logo-icon">
        <img src="{% static 'users/images/logo.png' %}" alt="UFootball Logo">
      </div>
      <div class="logo-text">UFootball</div>
      <div class="subtitle">Ultimate Football Experience</div>
    </div>

    <div class="status-container">
      <div class="success-icon">
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19L21 7l-1.41-1.41L9 16.17Z" />
        </svg>
      </div>
      <div class="success-badge">✓ Account Activated</div>
    </div>

    <h1>Welcome to the Team!</h1>
    <p>Your account has been successfully activated. You're now ready to experience the ultimate football management
      platform.</p>

  </div>
</body>

</html>
